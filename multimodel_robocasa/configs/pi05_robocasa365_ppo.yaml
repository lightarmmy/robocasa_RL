defaults:
  - env/robocasa365@env.train
  - env/robocasa365@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:PI05_RLINF_LOG_DIR,${oc.env:REPO_PATH}/results/pi05_robocasa365_ppo}
    project_name: rlinf
    experiment_name: pi05_robocasa365_ppo
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: ${oc.decode:${oc.env:PI05_RLINF_MAX_STEPS,1}}
  only_eval: false
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:PI05_RLINF_SAVE_INTERVAL,10}}
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: ${oc.decode:${oc.env:PI05_RLINF_TRAIN_ENVS,1}}
    split: target
    task_soup: target50
    task_mode: null
    task_sampling_strategy: ordered
    rotate_tasks_on_rollout: false
    rotate_tasks_on_auto_reset: true
    auto_reset: true
    ignore_terminations: false
    episode_horizon_source: max_episode_steps
    max_episode_steps: 768
    max_steps_per_rollout_epoch: 64
    group_size: 1
    reward_coef: 1.0
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 0
    total_num_envs: 1
    split: target
    task_soup: target50
    task_mode: null
    task_sampling_strategy: ordered
    auto_reset: false
    ignore_terminations: false
    use_fixed_reset_state_ids: true
    episode_horizon_source: task_horizon
    max_episode_steps: 3008
    max_steps_per_rollout_epoch: 3008
    group_size: 1
    is_eval: true

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_prev_infos: true
  collect_final_values: true
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
  model:
    model_type: openpi
    model_path: ${actor.model.model_path}
    precision: null

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: ${oc.decode:${oc.env:PI05_RLINF_GLOBAL_BATCH,1}}
  seed: 42
  enable_offload: false
  model:
    model_type: openpi
    model_path: ${oc.env:PI05_BASE_CKPT}
    precision: null
    num_action_chunks: 10
    action_dim: 12
    num_steps: 5
    add_value_head: true
    openpi:
      config_name: pi05_robocasa365_pretrain_human300
      num_images_in_input: 3
      action_chunk: 10
      action_env_dim: 12
      num_steps: 5
      noise_method: flow_sde
      noise_level: 0.5
      train_expert_only: true
      add_value_head: true
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
    openpi_data:
      norm_stats_path: ${oc.env:PI05_ROBOCASA_NORM_STATS}
  optim:
    lr: ${oc.decode:${oc.env:PI05_RLINF_LR,1.0e-6}}
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: false

critic:
  use_critic_model: false
