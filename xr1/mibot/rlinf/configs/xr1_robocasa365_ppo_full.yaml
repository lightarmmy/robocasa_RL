defaults:
  - env/robocasa365@env.train
  - env/robocasa365@env.eval
  - model/xr1_ppo@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:XR1_RLINF_LOG_DIR,${oc.env:REPO_PATH}/results/xr1_robocasa365_ppo_full}
    project_name: rlinf
    experiment_name: xr1_robocasa365_ppo_full
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: ${oc.decode:${oc.env:XR1_RLINF_MAX_STEPS,1}}
  only_eval: false
  val_check_interval: -1
  save_interval: ${oc.decode:${oc.env:XR1_RLINF_SAVE_INTERVAL,10}}
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2
  recompute_logprobs: false
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.001
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -2.0
  clip_log_ratio_max: 2.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: ${oc.decode:${oc.env:XR1_RLINF_TRAIN_ENVS,1}}
    split: target
    task_soup: target50
    task_mode: null
    # Ordered episode-level rotation makes task coverage deterministic. Never
    # rotate at rollout boundaries: that would cut 3000-step sparse-reward
    # episodes into 64-step fragments.
    task_sampling_strategy: ordered
    rotate_tasks_on_rollout: false
    auto_reset: true
    rotate_tasks_on_auto_reset: true
    # The old renderer died after roughly 800 simulator steps. End the training
    # episode at a chunk-aligned 768 steps and replace the whole simulator
    # process at the task boundary. Standalone evaluation still uses each
    # benchmark task's official horizon.
    episode_horizon_source: max_episode_steps
    max_episode_steps: ${oc.decode:${oc.env:XR1_RLINF_EPISODE_STEPS,768}}
    max_steps_per_rollout_epoch: ${oc.decode:${oc.env:XR1_RLINF_ROLLOUT_STEPS,64}}
    group_size: 1
    reward_coef: 1.0
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    split: target
    task_soup: target50
    task_mode: null
    task_sampling_strategy: ordered
    auto_reset: false
    ignore_terminations: false
    use_fixed_reset_state_ids: true
    episode_horizon_source: task_horizon
    max_episode_steps: 3008
    max_steps_per_rollout_epoch: 3008
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_prev_infos: true
  collect_final_values: true
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 0
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
  model:
    model_type: xr1_ppo
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    is_lora: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: ${oc.decode:${oc.env:XR1_RLINF_MICRO_BATCH,1}}
  global_batch_size: ${oc.decode:${oc.env:XR1_RLINF_GLOBAL_BATCH,1}}
  seed: 42
  enable_offload: false
  model:
    add_value_head: true
  optim:
    lr: ${oc.decode:${oc.env:XR1_RLINF_LR,1.0e-6}}
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: false
critic:
  use_critic_model: false
